<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ReadAloud</title>
<style>
:root{--system-blue:#007aff;--system-green:#34c759;--system-red:#ff3b30;--system-gray-bg:#f5f5f7;--system-card-bg:#fff;--system-btn-grey:#efeff4;--text-primary:#1d1d1f;--text-secondary:#86868b;--radius:20px}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--system-gray-bg);color:var(--text-primary);margin:0;padding:100px 20px 40px;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
header{position:fixed;top:0;left:0;right:0;height:74px;background:rgba(245,245,247,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:900;display:flex;align-items:center;padding:0 30px;box-shadow:0 4px 12px rgba(0,0,0,.03)}
h1{font-weight:600;font-size:24px;margin:0}.mode-nav{position:fixed;top:20px;right:30px;background:rgba(255,255,255,.7);backdrop-filter:blur(20px);padding:4px;border-radius:12px;border:1px solid rgba(0,0,0,.05);display:flex;gap:4px;z-index:1000}
.mode-btn{border:none;background:transparent;padding:6px 14px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-secondary)}.mode-btn.active{background:#fff;color:var(--text-primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.container{width:100%;max-width:600px;display:none}.container.active{display:block}.card{background:#fff;padding:30px;border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.04);margin-bottom:20px}
input,textarea{width:100%;padding:14px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;margin-bottom:12px;box-sizing:border-box;outline:none;font-family:inherit;background:#fafafa}input.error{border-color:var(--system-red)!important}
.apple-btn{background:var(--system-btn-grey);color:var(--text-primary);border:none;padding:14px 24px;border-radius:24px;font-weight:600;cursor:pointer;width:100%;font-size:15px;display:flex;align-items:center;justify-content:center}.apple-btn:disabled{opacity:.6;cursor:not-allowed}.apple-btn.recording{background:var(--system-red);color:#fff;animation:pulse 1.5s infinite}.apple-btn.processing{background:var(--system-blue);color:#fff}
@keyframes pulse{50%{opacity:.8}}.spinner{display:none;width:14px;height:14px;border:2px solid rgba(0,0,0,.1);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
.mic-test-container{margin:10px 0 20px;padding:14px;background:#f9f9fb;border-radius:12px;display:flex;align-items:center;gap:12px;font-size:13px;border:1px solid #efeff4}.mic-visualizer{flex-grow:1;height:6px;background:#e3e3e8;border-radius:3px;overflow:hidden}.mic-bar{height:100%;width:0;background:var(--system-green);transition:width .1s}.mic-status-dot{width:8px;height:8px;border-radius:50%;background:#d1d1d6;flex-shrink:0}.mic-status-dot.active{background:var(--system-green);box-shadow:0 0 8px var(--system-green)}
.passage-wrapper{display:grid;grid-template-columns:1fr 44px;align-items:center;gap:16px;margin:30px 0 10px;min-height:80px}#passageDisplay,#feedbackArea{font-size:22px;font-weight:500;line-height:1.5;margin:0}.word-correct{color:var(--system-green)}.word-wrong{color:var(--system-red);text-decoration:underline}.translation-text{font-size:15px;color:var(--text-secondary);opacity:.7;margin-bottom:25px}.progress-text{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px}.speak-icon{width:44px;height:44px;background:var(--system-btn-grey);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
#speechStatus{text-align:center;font-size:12px;min-height:18px;margin:8px 0;color:var(--text-secondary)}#speechStatus.active{color:var(--system-red)}#speechStatus.success{color:var(--system-green)}#speechStatus.error{color:var(--system-red)}
#scoreTableArea{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;margin:15px 0}th{background:#f9f9fb;color:var(--text-secondary);font-size:10px;padding:12px 10px;border-bottom:1px solid #eee;text-transform:uppercase}td{padding:12px 10px;border-bottom:1px solid #f9f9f9;font-size:13px}.id-badge{background:var(--system-btn-grey);padding:20px;border-radius:14px;text-align:center;font-family:monospace;font-size:24px;margin:20px 0;border:1px solid #d2d2d7}
@media(max-width:600px){body{padding-left:12px;padding-right:12px}header{padding:0 18px}header h1{font-size:20px}.mode-nav{right:12px}.card{padding:22px}}
</style>
</head>
<body>
<header><h1>Read Aloud</h1></header>
<div class="mode-nav">
<button class="mode-btn active" id="btnStudent" onclick="switchView('student')">Student</button>
<button class="mode-btn" id="btnTeacher">Teacher</button>
</div>

<div id="studentView" class="container active">
<div class="card" id="studentEntry">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<input type="text" id="sClass" placeholder="Class (e.g. 1A)">
<input type="number" id="sNo" placeholder="No.">
</div>
<input type="text" id="sName" placeholder="Full Name">
<input type="text" id="sTaskId" class="uppercase-input" placeholder="ENTER TASK ID" value="ID-" oninput="handleTaskIdInput(this)">
<div class="mic-test-container">
<div class="mic-status-dot" id="micDot"></div>
<div style="flex-shrink:0;font-weight:500" id="micLabel">Mic Check:</div>
<div class="mic-visualizer"><div class="mic-bar" id="micBar"></div></div>
<button onclick="startMicTest(event)" type="button" id="micTestBtn" style="font-size:11px;padding:6px 10px;border-radius:8px;border:none;background:#007aff;color:white;cursor:pointer;font-weight:600">Test Mic</button>
</div>
<button class="apple-btn" id="btnJoin" onclick="fetchTask()" type="button"><div class="spinner" id="spinJoin"></div>Join Task</button>
</div>

<div id="readingSection" class="card" style="display:none">
<div id="practiceArea">
<div class="progress-text" id="chunkProgress"></div>
<div class="passage-wrapper">
<div id="textContainer"><div id="passageDisplay"></div><div id="feedbackArea"></div></div>
<button class="speak-icon" onclick="playText()" type="button">🔊</button>
</div>
<div id="translationText" class="translation-text"></div>
<button id="recordBtn" class="apple-btn" onclick="toggleRecording()" type="button">🎤 Start Recording</button>
<div id="speechStatus"></div><div id="recordHint" style="text-align:center;font-size:12px;color:var(--text-secondary);min-height:18px;margin:8px 0">Tap Start Recording and read the sentence aloud.</div><div id="feedbackPanel" style="display:none;margin-top:18px;padding:14px;border-radius:14px;background:#f9f9fb;border:1px solid #efeff4;font-size:13px;color:var(--text-secondary)"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-bottom:6px">What I heard</div><div id="transcriptText" style="color:var(--text-primary);line-height:1.5"></div></div>
<div id="postReadingActions" style="display:none;flex-direction:column;align-items:center;width:100%">
<button id="nextChunkBtn" class="apple-btn" style="color:var(--system-blue)" onclick="nextChunk()" type="button"><div class="spinner" id="spinNext"></div><span id="nextBtnText">Next Sentence →</span></button>
<button style="background:none;border:none;color:var(--text-secondary);margin-top:15px;text-decoration:underline;cursor:pointer" onclick="retrySentence()" type="button">Retry this sentence</button>
</div>
</div>
<div id="resultScreen" style="display:none;text-align:center;padding:20px 0">
<div style="font-size:48px;margin-bottom:10px">🎉</div><h2 style="margin-bottom:5px">Mission Complete!</h2>
<div style="font-size:42px;font-weight:700;color:var(--system-green);margin-bottom:20px" id="finalScoreDisplay">0%</div>
<div id="studentLeaderboard" style="margin-top:20px;border-top:1px solid #eee;padding-top:20px"><h3 style="font-size:11px;color:var(--text-secondary);text-transform:uppercase">Top Performers</h3><div id="leaderboardList"></div></div>
<button class="apple-btn" onclick="location.reload()" style="margin-top:20px" type="button">Back to Home</button>
</div>
</div>
</div>

<div id="teacherView" class="container">
<div class="sub-nav" style="display:flex;gap:8px;margin-bottom:20px;background:#e3e3e8;padding:5px;border-radius:14px;width:fit-content">
<button class="mode-btn active" id="subSet" onclick="toggleTeacherMode('setup')" type="button">Setup Task</button>
<button class="mode-btn" id="subScore" onclick="toggleTeacherMode('scores')" type="button">Check Scores</button>
</div>
<div id="setupMode" class="card">
<input type="text" id="tName" placeholder="Teacher Name"><textarea id="tPassage" placeholder="Paste reading passage..." rows="5"></textarea>
<button class="apple-btn" id="btnCreate" onclick="createTask()" type="button"><div class="spinner" id="spinCreate"></div>Generate Task ID</button>
<div id="generatedIdArea" style="display:none"><div class="id-badge" id="displayId"></div></div>
</div>
<div id="scoreMode" class="card" style="display:none">
<input type="text" id="tSearchId" class="uppercase-input" placeholder="ENTER TASK ID" value="ID-" oninput="handleTaskIdInput(this)">
<button class="apple-btn" id="btnLoadScores" onclick="getScores()" type="button"><div class="spinner" id="spinScores"></div>Load Scores</button>
<div id="scoreActionArea" style="display:none;margin-top:15px"><button class="apple-btn" onclick="downloadCSV()" type="button" style="font-size:13px;padding:10px;background:white;border:1px solid #d2d2d7">📥 Download CSV</button></div>
<div id="scoreTableArea"></div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwe3Oci_vG0U4Qgi9IBCdj62xuStlwhrIxsOvVdGvYUtn_vO29KcJ1DDL9utPMWvmsI/exec";
let chunks=[],currentChunkIdx=0,totalMatches=0,totalWords=0;
let recognition=null,isRecording=false,isProcessingSpeech=false,recognitionStarted=false,recognitionSession=0,recognitionAudioStarted=false,recognitionRetryCount=0,recognitionMicStream=null,audioStartWatchdog=null;
let finalTranscript="",recognitionTranscript="",finishDelayTimeout=null,tempMatches=0,tempTotal=0,pressTimer,currentScores=[],isSubmitting=false;
let audioContext=null,analyser=null,microphone=null,micStream=null,micAnimationFrame=null;

window.onload=function(){
document.getElementById("sClass").value=localStorage.getItem("reader_class")||"";
document.getElementById("sNo").value=localStorage.getItem("reader_no")||"";
document.getElementById("sName").value=localStorage.getItem("reader_name")||"";
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition)window.SpeechRecognitionClass=SpeechRecognition;
setupTeacherAccess();
if(window.speechSynthesis){window.speechSynthesis.getVoices();if(window.speechSynthesis.onvoiceschanged!==undefined)window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();}
};

function clearSpeechTimers(){clearTimeout(finishDelayTimeout);finishDelayTimeout=null}
function setSpeechStatus(message,type){const el=document.getElementById("speechStatus");if(!el)return;el.innerText=message||"";el.className="";if(type)el.classList.add(type)}

async function startMicTest(event){
if(event)event.preventDefault();
const btn=document.getElementById("micTestBtn");
try{
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("getUserMedia not available");
stopMicTest();
micStream=await navigator.mediaDevices.getUserMedia({audio:true});
document.getElementById("micDot").classList.add("active");
document.getElementById("micLabel").innerText="Mic Active:";
btn.innerText="Working!";btn.style.opacity=".6";
const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
audioContext=new AC();if(audioContext.state==="suspended"){try{await audioContext.resume()}catch(e){}}
analyser=audioContext.createAnalyser();microphone=audioContext.createMediaStreamSource(micStream);analyser.fftSize=512;
microphone.connect(analyser);const data=new Uint8Array(analyser.frequencyBinCount);
function update(){if(!analyser)return;analyser.getByteFrequencyData(data);let total=0;for(let i=0;i<data.length;i++)total+=data[i];document.getElementById("micBar").style.width=Math.min(100,total/data.length*2.5)+"%";micAnimationFrame=requestAnimationFrame(update)}update();
}catch(err){console.error("[Mic Test]",err);stopMicTest();if(err?.name==="NotAllowedError")alert("Microphone permission was denied. Please allow microphone access for this website.");else alert("The microphone could not be accessed. Please check the browser and phone microphone settings.")}}
function stopMicTest(){if(micAnimationFrame){cancelAnimationFrame(micAnimationFrame);micAnimationFrame=null}if(microphone){try{microphone.disconnect()}catch(e){}microphone=null}if(analyser){try{analyser.disconnect()}catch(e){}analyser=null}if(audioContext){try{audioContext.close()}catch(e){}audioContext=null}if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}const d=document.getElementById("micDot"),l=document.getElementById("micLabel"),b=document.getElementById("micTestBtn"),bar=document.getElementById("micBar");if(d)d.classList.remove("active");if(l)l.innerText="Mic Check:";if(b){b.innerText="Test Mic";b.style.opacity="1"}if(bar)bar.style.width="0%"}
function stopRecognitionMic(){if(recognitionMicStream){try{recognitionMicStream.getTracks().forEach(t=>t.stop())}catch(e){}recognitionMicStream=null}}

function handleTaskIdInput(input){if(!input.value.startsWith("ID-"))input.value="ID-";input.value=input.value.toUpperCase()}

async function fetchTask(){
const sClass=document.getElementById("sClass"),sNo=document.getElementById("sNo"),sName=document.getElementById("sName"),sTaskId=document.getElementById("sTaskId");
[sClass,sNo,sName,sTaskId].forEach(e=>e.classList.remove("error"));let err=false;
if(!sClass.value.trim()){sClass.classList.add("error");err=true}if(!sNo.value.trim()){sNo.classList.add("error");err=true}if(!sName.value.trim()){sName.classList.add("error");err=true}
const cleanedId=sTaskId.value.trim().toUpperCase();if(!cleanedId||cleanedId==="ID-"){sTaskId.classList.add("error");err=true}if(err)return;
localStorage.setItem("reader_class",sClass.value.trim());localStorage.setItem("reader_no",sNo.value.trim());localStorage.setItem("reader_name",sName.value.trim());stopMicTest();
setBtnLoading("btnJoin","spinJoin",true,"Join Task");
try{
const res=await fetch(`${API_URL}?action=getTask&taskId=${encodeURIComponent(cleanedId)}`);if(!res.ok)throw new Error("HTTP "+res.status);const data=await res.json();
if(data.passage==="NOT_FOUND"){sTaskId.classList.add("error");alert("Invalid Task ID. Please check and try again.")}
else if(!data.passage)alert("This task does not contain a reading passage.");
else{
chunks=(data.passage.match(/[^.!?]+[.!?]+/g)||[data.passage]).map(c=>c.trim()).filter(Boolean);
document.getElementById("studentEntry").style.display="none";document.getElementById("readingSection").style.display="block";currentChunkIdx=0;totalMatches=0;totalWords=0;tempMatches=0;tempTotal=0;showChunk()
}}catch(e){console.error("[Task]",e);alert("Network error. Please check your connection.")}
setBtnLoading("btnJoin","spinJoin",false,"Join Task")
}

async function showChunk(){
cancelSpeechRecognition();const text=chunks[currentChunkIdx];document.getElementById("chunkProgress").innerText=`Sentence ${currentChunkIdx+1} of ${chunks.length}`;
document.getElementById("passageDisplay").innerText=text;document.getElementById("passageDisplay").style.display="block";document.getElementById("feedbackArea").innerHTML="";
document.getElementById("recordBtn").style.display="flex";document.getElementById("postReadingActions").style.display="none";if(document.getElementById("feedbackPanel")){document.getElementById("feedbackPanel").style.display="none";}if(document.getElementById("recordHint")){document.getElementById("recordHint").innerText="Tap Start Recording and read the sentence aloud.";}document.getElementById("nextBtnText").innerText=currentChunkIdx===chunks.length-1?"Finish & Submit 🎉":"Next Sentence →";setSpeechStatus("");
const trans=document.getElementById("translationText");trans.innerText="...";
try{const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-TW`);const d=await res.json();trans.innerText=d.responseData?.translatedText||""}catch(e){console.error("[Translation]",e);trans.innerText=""}
}
function playText(){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(chunks[currentChunkIdx]);const voices=window.speechSynthesis.getVoices();const v=voices.find(x=>x.name.includes("Google US English"))||voices.find(x=>x.name.includes("Samantha"))||voices.find(x=>x.lang.startsWith("en-US"));if(v)u.voice=v;u.lang="en-US";u.rate=.85;u.pitch=1;window.speechSynthesis.speak(u)}

/* ============================================================
   STUDENT RECORDING — SIMPLIFIED PER-SENTENCE ENGINE
   One fresh recognition session per sentence.
   No getUserMedia priming, no auto-restart, no cross-sentence state.
============================================================ */
function createRecognitionForSentence(){
    const SpeechRecognition = window.SpeechRecognitionClass;
    if (!SpeechRecognition) return null;

    const r = new SpeechRecognition();
    r.lang = "en-US";
    r.continuous = false;
    r.interimResults = false;
    r.maxAlternatives = 1;
    return r;
}

let recordingState = "idle"; // idle | starting | listening | stopping | finished
let sentenceTranscript = "";
let sentenceHasResult = false;
let userRequestedStop = false;

function toggleRecording(){
    const rb = document.getElementById("recordBtn");

    if (!window.SpeechRecognitionClass){
        alert("Speech recognition is not supported in this browser. Please use Chrome or Safari.");
        return;
    }

    if (recordingState === "idle"){
        startSentenceRecording();
        return;
    }

    if (recordingState === "starting" || recordingState === "listening"){
        stopSentenceRecording();
        return;
    }
}

function startSentenceRecording(){
    destroyRecognition();

    sentenceTranscript = "";
    sentenceHasResult = false;
    userRequestedStop = false;
    recordingState = "starting";

    const rb = document.getElementById("recordBtn");
    rb.disabled = false;
    rb.innerText = "🎤 Starting…";
    rb.classList.add("recording");
    rb.classList.remove("processing");

    document.getElementById("recordHint").innerText =
        "Starting the microphone…";
    setSpeechStatus("Starting microphone…", "active");

    recognition = createRecognitionForSentence();

    if (!recognition){
        recordingState = "idle";
        resetRecordButton();
        setSpeechStatus("Speech recognition is unavailable.", "error");
        return;
    }

    recognition.onstart = function(){
        recordingState = "listening";
        rb.innerText = "⏹ Stop & Check";
        document.getElementById("recordHint").innerText =
            "I'm listening. Read the sentence, then tap Stop & Check.";
        setSpeechStatus("Listening…", "active");
        console.log("[Speech] start");
    };

    recognition.onresult = function(event){
        let parts = [];
        for (let i = event.resultIndex; i < event.results.length; i++){
            if (event.results[i].isFinal){
                const t = event.results[i][0]?.transcript?.trim() || "";
                if (t) parts.push(t);
            }
        }
        if (parts.length){
            sentenceTranscript = parts.join(" ").trim();
            sentenceHasResult = true;
            console.log("[Speech] result:", sentenceTranscript);
            setSpeechStatus("Speech detected ✓", "success");
        }
    };

    recognition.onspeechstart = function(){
        if (recordingState === "starting") recordingState = "listening";
        setSpeechStatus("Listening to you…", "active");
    };

    recognition.onerror = function(event){
        console.error("[Speech] error:", event.error);

        if (event.error === "no-speech"){
            recordingState = "idle";
            destroyRecognition();
            resetRecordButton();
            setSpeechStatus("I couldn't detect speech.", "error");
            document.getElementById("recordHint").innerText =
                "Tap Start Recording and try again.";
            return;
        }

        if (event.error === "not-allowed" || event.error === "service-not-allowed"){
            recordingState = "idle";
            destroyRecognition();
            resetRecordButton();
            setSpeechStatus("Microphone permission was blocked.", "error");
            alert("Microphone access is blocked. Please allow microphone access for this website and try again.");
            return;
        }

        if (event.error === "audio-capture"){
            recordingState = "idle";
            destroyRecognition();
            resetRecordButton();
            setSpeechStatus("The microphone could not be accessed.", "error");
            alert("The microphone could not be accessed. Please check the phone's microphone settings.");
            return;
        }

        if (event.error === "network"){
            recordingState = "idle";
            destroyRecognition();
            resetRecordButton();
            setSpeechStatus("Speech recognition service unavailable.", "error");
            alert("Speech recognition could not connect. Please check the Internet connection.");
            return;
        }

        recordingState = "idle";
        destroyRecognition();
        resetRecordButton();
        setSpeechStatus("Speech recognition could not complete.", "error");
    };

    recognition.onend = function(){
        console.log("[Speech] end; state:", recordingState, "requested:", userRequestedStop, "result:", sentenceTranscript);

        if (recordingState === "stopping" || sentenceHasResult){
            finishSentenceRecording();
            return;
        }

        /* Mobile browsers may close recognition unexpectedly. Do NOT restart it. */
        recordingState = "idle";
        destroyRecognition();
        resetRecordButton();
        setSpeechStatus("Recording ended before speech was captured.", "error");
        document.getElementById("recordHint").innerText =
            "Tap Start Recording and try again.";
    };

    try{
        recognition.start();
        console.log("[Speech] recognition.start() called");
    }catch(err){
        console.error("[Speech] start exception:", err);
        recordingState = "idle";
        destroyRecognition();
        resetRecordButton();
        setSpeechStatus("Could not start speech recognition.", "error");
    }
}

function stopSentenceRecording(){
    if (!recognition){
        finishSentenceRecording();
        return;
    }

    userRequestedStop = true;
    recordingState = "stopping";

    const rb = document.getElementById("recordBtn");
    rb.disabled = true;
    rb.innerText = "⏳ Checking…";
    rb.classList.remove("recording");
    rb.classList.add("processing");

    document.getElementById("recordHint").innerText = "Checking what you said…";
    setSpeechStatus("Checking…", "active");

    try{
        recognition.stop();
    }catch(err){
        console.error("[Speech] stop exception:", err);
        finishSentenceRecording();
    }
}

function finishSentenceRecording(){
    if (recordingState === "finished") return;
    recordingState = "finished";

    const transcript = (sentenceTranscript || "").trim();
    console.log("[Speech] final sentence:", transcript);

    destroyRecognition();

    if (!transcript){
        recordingState = "idle";
        resetRecordButton();
        setSpeechStatus("No speech was captured.", "error");
        document.getElementById("recordHint").innerText =
            "Tap Retry this sentence and speak clearly.";
        return;
    }

    processResult(transcript);
}

function destroyRecognition(){
    const old = recognition;
    recognition = null;

    if (!old) return;

    try{
        old.onstart = null;
        old.onresult = null;
        old.onerror = null;
        old.onend = null;
        old.onspeechstart = null;
    }catch(e){}

    try{ old.abort(); }catch(e){}
}

function cancelSpeechRecognition(){
    destroyRecognition();
    recordingState = "idle";
    sentenceTranscript = "";
    sentenceHasResult = false;
    userRequestedStop = false;
    resetRecordButton();
}

function resetRecordButton(){
    const rb = document.getElementById("recordBtn");
    if (!rb) return;
    rb.disabled = false;
    rb.innerText = "🎤 Start Recording";
    rb.classList.remove("recording");
    rb.classList.remove("processing");
}

function processResult(transcript){
    const clean = s => s.toLowerCase().replace(/[^\w\s]/g, "").trim();
    const targetWords = chunks[currentChunkIdx].trim().split(/\s+/);
    const userWords = clean(transcript).split(/\s+/).filter(Boolean);

    let html = "";
    let matches = 0;
    const used = new Set();

    targetWords.forEach(function(word){
        const target = clean(word);
        let index = -1;

        for (let i = 0; i < userWords.length; i++){
            if (!used.has(i) && userWords[i] === target){
                index = i;
                break;
            }
        }

        if (index !== -1){
            used.add(index);
            matches++;
            html += `<span class="word-correct">${escapeHtml(word)} </span>`;
        }else{
            html += `<span class="word-wrong">${escapeHtml(word)} </span>`;
        }
    });

    tempMatches = matches;
    tempTotal = targetWords.length;

    document.getElementById("passageDisplay").style.display = "none";

    const feedback = document.getElementById("feedbackArea");
    feedback.style.display = "block";
    feedback.innerHTML = html;

    document.getElementById("recordBtn").style.display = "none";
    document.getElementById("postReadingActions").style.display = "flex";

    const panel = document.getElementById("feedbackPanel");
    if (panel){
        panel.style.display = "block";
        const transcriptEl = document.getElementById("transcriptText");
        if (transcriptEl) transcriptEl.innerText = transcript;
    }

    const percentage = targetWords.length
        ? Math.round(matches / targetWords.length * 100)
        : 0;

    setSpeechStatus(
        `Speech checked — ${matches}/${targetWords.length} words matched (${percentage}%).`,
        "success"
    );

    const hint = document.getElementById("recordHint");
    if (hint) hint.innerText = "Green = matched. Red = not matched by the recogniser.";
}

function escapeHtml(str){
    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function parseScore(val){let num=parseFloat(val);if(isNaN(num))return 0;return num<2?Math.round(num*100):Math.round(num)}

async function nextChunk(){
if(isSubmitting)return;totalMatches+=tempMatches;totalWords+=tempTotal;
if(currentChunkIdx<chunks.length-1){currentChunkIdx++;tempMatches=0;tempTotal=0;showChunk();return}
isSubmitting=true;setBtnLoading("nextChunkBtn","spinNext",true,"Saving...");
const score=totalWords>0?Math.max(0,Math.min(100,Math.round(totalMatches/totalWords*100))):0;const tId=document.getElementById("sTaskId").value.trim().toUpperCase();
try{
await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"submitScore",taskId:tId,className:document.getElementById("sClass").value,classNo:document.getElementById("sNo").value,name:document.getElementById("sName").value,score})});
const res=await fetch(`${API_URL}?action=getScores&taskId=${encodeURIComponent(tId)}`);let all=await res.json();let top=all.sort((a,b)=>parseScore(b[5])-parseScore(a[5])).slice(0,5);let board="<table>";top.forEach((r,i)=>{const icon=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";board+=`<tr><td>${icon} ${r[2]}-${r[3]} ${r[4]}</td><td style="text-align:right"><b>${parseScore(r[5])}%</b></td></tr>`});board+="</table>";document.getElementById("leaderboardList").innerHTML=board;document.getElementById("practiceArea").style.display="none";document.getElementById("resultScreen").style.display="block";document.getElementById("finalScoreDisplay").innerText=score+"%"
}catch(err){console.error(err);alert("Submission error. Your results might not have saved.");isSubmitting=false}
setBtnLoading("nextChunkBtn","spinNext",false,"Next Sentence →")
}
function retrySentence(){tempMatches=0;tempTotal=0;showChunk()}

function setupTeacherAccess(){
const btn=document.getElementById("btnTeacher");const start=e=>{if(e.type==="touchstart")e.preventDefault();pressTimer=setTimeout(()=>executeSwitch("teacher"),2500)};const stop=()=>clearTimeout(pressTimer);
btn.addEventListener("touchstart",start,{passive:false});btn.addEventListener("touchend",stop);btn.addEventListener("touchcancel",stop);btn.addEventListener("mousedown",start);btn.addEventListener("mouseup",stop);btn.addEventListener("mouseleave",stop)
}
function toggleTeacherMode(m){document.getElementById("setupMode").style.display=m==="setup"?"block":"none";document.getElementById("scoreMode").style.display=m==="scores"?"block":"none";document.getElementById("subSet").className=m==="setup"?"mode-btn active":"mode-btn";document.getElementById("subScore").className=m==="scores"?"mode-btn active":"mode-btn"}
function switchView(v){if(v==="student")executeSwitch("student")}
function executeSwitch(v){document.querySelectorAll(".container").forEach(c=>c.classList.remove("active"));document.getElementById(v+"View").classList.add("active");document.querySelectorAll(".mode-nav .mode-btn").forEach(b=>b.classList.remove("active"));document.getElementById("btn"+v.charAt(0).toUpperCase()+v.slice(1)).classList.add("active")}

async function getScores(){
const tId=document.getElementById("tSearchId").value.trim().toUpperCase();if(!tId||tId==="ID-")return;setBtnLoading("btnLoadScores","spinScores",true,"Loading...");
try{const res=await fetch(`${API_URL}?action=getScores&taskId=${encodeURIComponent(tId)}`);currentScores=await res.json();document.getElementById("scoreActionArea").style.display=currentScores.length?"block":"none";let h="<table><tr><th>Time</th><th>Class</th><th>Student</th><th>Score</th></tr>";currentScores.slice().reverse().forEach(r=>{const s=parseScore(r[5]),rawDate=r[1];let dateDisplay="N/A";if(rawDate){const d=new Date(rawDate);dateDisplay=isNaN(d)?rawDate:`${d.toLocaleDateString()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`}h+=`<tr><td style="font-size:10px;color:#888">${dateDisplay}</td><td>${r[2]}-${r[3]}</td><td><b>${r[4]}</b></td><td style="color:var(--system-green);font-weight:700">${s}%</td></tr>`});h+="</table>";document.getElementById("scoreTableArea").innerHTML=h}catch(e){console.error(e);alert("Failed to load scores.")}setBtnLoading("btnLoadScores","spinScores",false,"Load Scores")
}
function downloadCSV(){if(!currentScores.length)return;const content=["Timestamp,TaskID,Class,No,Name,Score",...currentScores.map(r=>`"${r[1]}","${r[0]}","${r[2]}","${r[3]}","${r[4]}","${parseScore(r[5])}%"`)].join("\n");const blob=new Blob([content],{type:"text/csv"}),link=document.createElement("a"),url=URL.createObjectURL(blob);link.href=url;link.download=`reading_scores_${document.getElementById("tSearchId").value}.csv`;document.body.appendChild(link);link.click();document.body.removeChild(link);setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function createTask(){const p=document.getElementById("tPassage").value.trim(),t=document.getElementById("tName").value.trim();if(!p||!t)return;setBtnLoading("btnCreate","spinCreate",true,"Generating...");try{const res=await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"createTask",email:t,passage:p})});const newId=await res.text();document.getElementById("displayId").innerText=newId;document.getElementById("generatedIdArea").style.display="block"}catch(e){console.error(e);alert("Failed to generate task ID.")}setBtnLoading("btnCreate","spinCreate",false,"Generate Task ID")}
function setBtnLoading(id,spin,load,text){const b=document.getElementById(id),s=document.getElementById(spin);if(!b)return;b.disabled=load;if(s)s.style.display=load?"inline-block":"none";b.innerHTML=load?"Wait...":(spin?`<div class="spinner" id="${spin}"></div> ${text}`:text)}
</script>
