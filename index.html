<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ReadAloud</title>
    <style>
        /* Liquid Glass Design System Tokens */
        :root {
            /* High Transparency Glass Fills */
            --glass-bg-primary: rgba(255, 255, 255, 0.08);
            --glass-bg-card: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.18);
            --glass-bg-input: rgba(255, 255, 255, 0.12);
            
            /* Glass Border Highlights */
            --glass-border-light: rgba(255, 255, 255, 0.18);
            --glass-border-strong: rgba(255, 255, 255, 0.3);
            
            /* Depth Shadows */
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-shadow-sm: 0 4px 16px 0 rgba(0, 0, 0, 0.25);
            
            /* Typography & System Colors */
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.65);
            --accent-blue: #0a84ff;
            --accent-green: #30d158;
            --accent-orange: #ff9f0a;
            --accent-red: #ff453a;
            
            /* System Border Radius & Insets */
            --radius-container: 20px;
            --radius-element: 12px;
            --radius-full: 9999px;
            --sab: env(safe-area-inset-bottom, 0px);
            --sat: env(safe-area-inset-top, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw;
            min-height: 100vh;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1f1c2c;
            color: var(--text-main);
            margin: 0;
            padding: calc(96px + var(--sat)) 20px calc(70px + var(--sab)) 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
        }

        /* Fixed Mobile Safari Compatibility Background Layer */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 50%, #2c3e50 100%);
            z-index: -2;
            pointer-events: none;
            transform: translateZ(0);
        }

        /* Ambient Dynamic Background Canvas */
        #liquidCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
            opacity: 0.75;
            transform: translateZ(0);
        }

        /* Fixed Glass Header Container */
        header {
            position: fixed;
            top: calc(16px + var(--sat));
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: calc(100% - 32px);
            max-width: 760px;
            height: 64px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow-sm);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.3px;
        }

        /* Mode Switcher Group */
        .mode-nav {
            display: flex; 
            gap: 6px; 
            align-items: center;
            background: var(--glass-bg-primary);
            padding: 4px;
            border-radius: var(--radius-element);
            border: 1px solid var(--glass-border-light);
        }

        .mode-btn {
            border: none; 
            background: transparent; 
            padding: 6px 14px;
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.2s ease;
            color: var(--text-muted);
            outline: none;
        }

        .mode-btn.active {
            background: var(--glass-bg-hover);
            color: var(--text-main);
            border: 1px solid var(--glass-border-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Flat Home Icon Button Styles */
        .home-btn {
            border: 1px solid var(--glass-border-light);
            background: var(--glass-bg-primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .home-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .spinner {
            display: none; 
            width: 14px; 
            height: 14px;
            border: 2px solid var(--glass-border-light);
            border-top-color: var(--text-main); 
            border-radius: 50%;
            animation: spin 0.8s linear infinite; 
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .container {
            width: 100%; 
            max-width: 620px; 
            display: none;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glass Card Component */
        .card {
            background: var(--glass-bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 28px;
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border-light);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
        }

        input, textarea, select {
            width: 100%; 
            padding: 12px 16px; 
            margin-bottom: 12px;
            background: var(--glass-bg-input);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-element); 
            font-size: 14px; 
            font-weight: 500;
            color: var(--text-main); 
            font-family: inherit;
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.2s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transform: translateZ(0);
        }

        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }

        input:focus, textarea:focus, select:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--glass-border-strong);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        input.error { 
            border: 1px solid var(--accent-red) !important; 
            background: rgba(255, 69, 58, 0.15); 
        }

        .uppercase-input { text-transform: uppercase; }

        /* Custom Inverted Select Options */
        select option {
            background-color: #1f1c2c;
            color: var(--text-main);
        }

        /* Glass Primary Button */
        .glass-btn {
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            color: var(--text-main);
            padding: 12px 24px; 
            border-radius: var(--radius-element);
            font-weight: 600; 
            cursor: pointer; 
            width: 100%; 
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex; 
            align-items: center; 
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transform: translateZ(0);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            outline: none;
            user-select: none;
        }

        .glass-btn:hover {
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-strong);
        }

        .glass-btn:active { 
            transform: scale(0.96) translateZ(0); 
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .glass-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .glass-btn.recording {
            background: rgba(255, 69, 58, 0.35); 
            color: #ffffff; 
            border-color: rgba(255, 69, 58, 0.8);
            animation: glassPulse 1.2s infinite alternate ease-in-out;
        }

        .glass-btn.processing {
            background: rgba(10, 132, 255, 0.35);
            color: #ffffff; 
            border-color: rgba(10, 132, 255, 0.6);
        }

        @keyframes glassPulse {
            0% {
                background: rgba(255, 69, 58, 0.28);
                border-color: rgba(255, 69, 58, 0.8);
                box-shadow: 0 0 20px rgba(255, 69, 58, 0.4);
            }
            100% {
                background: rgba(255, 159, 10, 0.32);
                border-color: rgba(255, 159, 10, 0.9);
                box-shadow: 0 0 30px rgba(255, 159, 10, 0.5);
            }
        }

        /* Mic Test Indicator */
        .mic-test-container {
            margin: 10px 0 20px 0; 
            padding: 12px 16px;
            background: var(--glass-bg-primary);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: var(--radius-element); 
            display: flex; 
            align-items: center; 
            gap: 12px;
            font-size: 13px; 
            border: 1px solid var(--glass-border-light);
            color: var(--text-sub);
        }

        .mic-visualizer { 
            flex-grow: 1; 
            height: 6px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 3px; 
            overflow: hidden; 
            position: relative; 
        }

        .mic-bar { 
            height: 100%; 
            width: 0%; 
            background: var(--accent-green); 
            transition: width 0.1s ease; 
        }

        .mic-status-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: var(--text-muted); 
            flex-shrink: 0; 
        }

        .mic-status-dot.active { 
            background: var(--accent-green); 
            box-shadow: 0 0 10px var(--accent-green); 
        }

        /* Passage Display */
        .passage-wrapper {
            display: grid; 
            grid-template-columns: 1fr 44px; 
            align-items: center;
            gap: 16px; 
            margin: 20px 0 10px 0; 
            min-height: 80px;
        }

        #passageDisplay, #feedbackArea { 
            font-size: 20px; 
            font-weight: 600; 
            line-height: 1.5; 
            margin: 0; 
            letter-spacing: -0.3px;
            color: var(--text-main);
        }

        .word-correct { color: var(--accent-green); }
        .word-wrong { color: var(--accent-red); text-decoration: underline; text-decoration-color: rgba(255, 69, 58, 0.6); }

        .translation-text { 
            font-size: 14px; 
            color: var(--text-muted); 
            margin-bottom: 20px; 
            min-height: 20px; 
        }

        .progress-text { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
        }

        /* Play Audio Icon Button */
        .speak-icon {
            width: 44px; 
            height: 44px; 
            background: var(--glass-bg-primary);
            border: 1px solid var(--glass-border-light);
            border-radius: var(--radius-full); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: var(--text-main);
            outline: none;
        }

        .speak-icon:hover { 
            background: var(--glass-bg-hover); 
            border-color: var(--glass-border-strong);
            transform: scale(1.05);
        }

        .speak-icon.playing { 
            background: rgba(10, 132, 255, 0.35); 
            color: #ffffff; 
            border-color: rgba(10, 132, 255, 0.6);
            transform: scale(1.05); 
        }

        #liveTranscriptArea {
            min-height: 30px; 
            font-size: 14px; 
            color: var(--text-sub); 
            font-style: italic;
            margin-bottom: 15px; 
            border-left: 3px solid var(--accent-blue); 
            padding-left: 12px;
            display: none; 
            line-height: 1.4;
        }

        /* Data Tables */
        #scoreTableArea { width: 100%; overflow-x: auto; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
            margin: 15px 0; 
        }

        th { 
            background: var(--glass-bg-primary); 
            color: var(--text-muted); 
            font-size: 11px; 
            padding: 12px 10px; 
            border-bottom: 1px solid var(--glass-border-light); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        th.sortable { cursor: pointer; user-select: none; transition: background 0.15s; }
        th.sortable:hover { background: var(--glass-bg-hover); color: var(--text-main); }
        .sort-icon { display: inline-block; margin-left: 4px; font-size: 10px; color: var(--accent-blue); }

        td { 
            padding: 12px 10px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            font-size: 13px; 
            color: var(--text-sub);
        }

        .id-badge {
            background: var(--glass-bg-primary); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px; 
            border-radius: var(--radius-element); 
            text-align: center; 
            font-family: SFMono-Regular, Menlo, Monaco, monospace;
            font-size: 22px; 
            font-weight: 700; 
            color: var(--text-main); 
            margin: 20px 0; 
            border: 1px solid var(--glass-border-light);
            box-shadow: var(--glass-shadow-sm);
        }

        .preview-box {
            background: var(--glass-bg-primary); 
            border: 1px solid var(--glass-border-light); 
            border-radius: var(--radius-element);
            padding: 15px; 
            margin-top: 15px; 
            font-size: 13px; 
            color: var(--text-sub);
        }

        .preview-sentence { padding: 8px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); }
        .preview-sentence:last-child { border-bottom: none; }

        #speechStatus { 
            text-align: center; 
            font-size: 12px; 
            min-height: 18px; 
            margin-top: 10px; 
            margin-bottom: 10px; 
            color: var(--text-muted); 
            font-weight: 500; 
        }

        #speechStatus.active { color: var(--accent-orange); }
        #speechStatus.success { color: var(--accent-green); }
        #speechStatus.error { color: var(--accent-red); }

        /* Liquid Glass Debug Console */
        #debugPanel {
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--text-main); 
            font-family: SFMono-Regular, Menlo, Monaco, monospace; 
            font-size: 11px;
            z-index: 9999; 
            transition: height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding-bottom: var(--sab);
            border-top: 1px solid var(--glass-border-light);
        }

        .debug-closed { height: calc(32px + var(--sab)); overflow: hidden; }
        .debug-open { height: 250px; overflow-y: auto; }

        .debug-header {
            background: rgba(255, 255, 255, 0.05); 
            color: var(--text-main); 
            padding: 8px 15px; 
            font-weight: bold;
            cursor: pointer; 
            position: sticky; 
            top: 0; 
            display: flex; 
            justify-content: space-between;
        }

        #debugContent { padding: 10px; overflow-y: auto; max-height: 218px; box-sizing: border-box; }
        .log-line { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .log-info { color: var(--text-sub); }
        .log-warn { color: var(--accent-orange); }
        .log-error { color: var(--accent-red); font-weight: bold; }
        .log-success { color: var(--accent-green); }

        @media (max-width: 600px) {
            body { padding-left: 12px; padding-right: 12px; padding-top: 90px; }
            header { width: calc(100% - 24px); padding: 0 16px; top: 12px; }
            header h1 { font-size: 18px; }
            .card { padding: 20px; }
        }

        #appVersion { 
            position: fixed; 
            right: 12px; 
            bottom: 4px; 
            font-size: 10px; 
            font-weight: 500; 
            color: var(--text-muted); 
            pointer-events: none; 
            z-index: 2000; 
        }
    </style>
</head>

<body>

<!-- Ambient Dynamic Background Canvas -->
<canvas id="liquidCanvas"></canvas>

<header>
    <h1>Read Aloud</h1>
    <!-- Header Right Control Area -->
    <div id="headerRightControl">
        <div class="mode-nav" id="modeNavContainer">
            <button class="mode-btn active" id="btnStudent" onclick="switchView('student')">Student</button>
            <button class="mode-btn" id="btnTeacher">Teacher</button>
        </div>
    </div>
</header>

<!-- STUDENT VIEW -->
<div id="studentView" class="container active">
    <div class="card" id="studentEntry">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
            <input type="text" id="sClass" placeholder="Class (e.g. 1A)">
            <input type="number" id="sNo" placeholder="No.">
        </div>
        <input type="text" id="sName" placeholder="Full Name">
        <input type="text" id="sTaskId" class="uppercase-input" placeholder="ENTER TASK ID" value="ID-" oninput="handleTaskIdInput(this)">

        <div class="mic-test-container">
            <div class="mic-status-dot" id="micDot"></div>
            <div style="flex-shrink:0; font-weight:600;" id="micLabel">Mic Check:</div>
            <div class="mic-visualizer"><div class="mic-bar" id="micBar"></div></div>
            <button onclick="startMicTest(event)" type="button" style="font-size:11px; padding:6px 12px; border-radius:8px; border:1px solid var(--glass-border-light); background:var(--glass-bg-primary); color:var(--text-main); cursor:pointer; font-weight:600;" id="micTestBtn">Test Mic</button>
        </div>

        <button class="glass-btn" id="btnJoin" onclick="fetchTask()" type="button">
            <div class="spinner" id="spinJoin"></div> Join Task
        </button>
    </div>

    <div id="readingSection" class="card" style="display:none">
        <div id="practiceArea">
            <div class="progress-text" id="chunkProgress"></div>
            <div class="passage-wrapper">
                <div id="textContainer">
                    <div id="passageDisplay"></div>
                    <div id="feedbackArea"></div>
                </div>
                <button class="speak-icon" id="speakBtn" onclick="playText()" type="button">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
                    </svg>
                </button>
            </div>
            
            <div id="translationText" class="translation-text"></div>
            <div id="liveTranscriptArea"></div>

            <button id="recordBtn" class="glass-btn" onclick="toggleRecording()" type="button">
                🎤 Start Recording
            </button>
            <div id="speechStatus"></div>

            <div id="postReadingActions" style="display:none; flex-direction:column; align-items:center; width:100%;">
                <button id="nextChunkBtn" class="glass-btn" style="background:rgba(10, 132, 255, 0.25); border-color:rgba(10, 132, 255, 0.4);" onclick="nextChunk()" type="button">
                    <div class="spinner" id="spinNext"></div>
                    <span id="nextBtnText">Next Sentence →</span>
                </button>
                <button style="background:none; border:none; color:var(--text-muted); margin-top:15px; text-decoration:underline; cursor:pointer; font-size:13px;" onclick="retrySentence()" type="button">
                    Retry this sentence
                </button>
            </div>
        </div>

        <div id="resultScreen" style="display:none; text-align:center; padding:20px 0;">
            <div style="font-size:48px; margin-bottom:10px;">🎉</div>
            <h2 style="margin-bottom:5px; font-weight:700;">Mission Complete!</h2>
            <div style="font-size:46px; font-weight:800; color:var(--accent-green); margin-bottom:20px;" id="finalScoreDisplay">0%</div>
            <div id="studentLeaderboard" style="margin-top:20px; border-top:1px solid var(--glass-border-light); padding-top:20px;">
                <h3 style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px;">Top Performers</h3>
                <div id="leaderboardList"></div>
            </div>
            <button class="glass-btn" onclick="location.reload()" style="margin-top:20px;" type="button">Back to Home</button>
        </div>
    </div>
</div>

<!-- TEACHER VIEW -->
<div id="teacherView" class="container">
    <div class="sub-nav" style="display:flex; gap:6px; margin-bottom:20px; background:var(--glass-bg-primary); padding:4px; border-radius:var(--radius-element); width:fit-content; border:1px solid var(--glass-border-light);">
        <button class="mode-btn active" id="subSet" onclick="toggleTeacherMode('setup')" type="button">Setup Task</button>
        <button class="mode-btn" id="subScore" onclick="toggleTeacherMode('scores')" type="button">Check Scores</button>
    </div>

    <div id="setupMode" class="card">
        <input type="text" id="tName" placeholder="Teacher Name">
        <textarea id="tPassage" placeholder="Paste reading passage..." rows="5"></textarea>
        <button class="glass-btn" id="btnCreate" onclick="createTask()" type="button">
            <div class="spinner" id="spinCreate"></div> Generate Task ID
        </button>
        <div id="generatedIdArea" style="display:none">
            <div class="id-badge" id="displayId"></div>
            <div class="preview-box" id="taskPreviewBox"></div>
        </div>
    </div>

    <div id="scoreMode" class="card" style="display:none">
        <input type="text" id="tSearchId" class="uppercase-input" placeholder="ENTER TASK ID" value="ID-" oninput="handleTaskIdInput(this)">
        <button class="glass-btn" id="btnLoadScores" onclick="getScores()" type="button">
            <div class="spinner" id="spinScores"></div> Load Scores
        </button>
        
        <div id="scoreActionArea" style="display:none; margin-top:15px; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center;">
            <select id="scoreDisplayMode" onchange="renderScoreTable()" style="margin-bottom:0; padding:10px; font-size:13px;">
                <option value="all">Show All Attempts</option>
                <option value="best">Highest Score Only</option>
                <option value="latest">Latest Attempt Only</option>
            </select>
            <button class="glass-btn" onclick="downloadCSV()" type="button" style="font-size:13px; padding:10px;">
                📥 Download CSV
            </button>
        </div>
        
        <div id="scoreTableArea"></div>
    </div>
</div>

<!-- Liquid Glass Debug Console -->
<div id="debugPanel" class="debug-closed">

/* Ambient Dynamic Background Canvas Engine */
const canvas = document.getElementById('liquidCanvas');
const ctx = canvas.getContext('2d');
let width, height, dpr;

function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
}

window.addEventListener('resize', () => {
    if (canvas.width !== window.innerWidth * (window.devicePixelRatio || 1)) {
        resizeCanvas();
    }
});
resizeCanvas();

const blobs = [
    { x: 0.2, y: 0.3, r: 0.45, color: 'rgba(100, 140, 255, 0.6)', vx: 0.0005, vy: 0.0004 },
    { x: 0.8, y: 0.2, r: 0.5, color: 'rgba(180, 100, 255, 0.55)', vx: -0.0004, vy: 0.0005 },
    { x: 0.5, y: 0.8, r: 0.4, color: 'rgba(255, 120, 180, 0.5)', vx: 0.0003, vy: -0.0004 }
];

function animateBlobs() {
    ctx.clearRect(0, 0, width, height);
    blobs.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        if (b.x < 0 || b.x > 1) b.vx *= -1;
        if (b.y < 0 || b.y > 1) b.vy *= -1;

        const grad = ctx.createRadialGradient(
            b.x * width, b.y * height, 0,
            b.x * width, b.y * height, b.r * Math.max(width, height)
        );
        grad.addColorStop(0, b.color);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x * width, b.y * height, b.r * Math.max(width, height), 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(animateBlobs);
}
animateBlobs();

/* Fetch Timeout Engine */
async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        return response;
    } catch (err) {
        clearTimeout(timer);
        throw err;
    }
}

/* Audio Hardware Wake-Up */
function wakeUpAudioSystem() {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(0);
        osc.stop(ctx.currentTime + 0.01);
        Debug.log("Silent audio ping sent.", "info");
    } catch(e) {
        Debug.log("Silent audio ping failed: " + e.message, "warn");
    }
}

/* Speech Recognition Engine (Fixed Android De-duplication) */
const SpeechEngine = {
    api: null,
    isRecording: false,
    transcript: "",
    interim: "",
    restartTimer: null,
    consecutiveErrors: 0,

    start: function(isManual = true) {
        const isAndroid = /Android/i.test(navigator.userAgent);

        if (isManual) {
            Debug.log("--- MANUAL START ---");
            this.transcript = "";
            this.interim = "";
            this.consecutiveErrors = 0;
            UI.setLiveTranscript("...");
        } else {
            Debug.log("--- AUTO RESTART ---");
            if (this.interim) {
                this.transcript += " " + this.interim;
                this.interim = "";
            }
        }
        
        this.isRecording = true;
        clearTimeout(this.restartTimer);

        if (this.api) {
            this.api.onstart = null;
            this.api.onresult = null;
            this.api.onerror = null;
            this.api.onend = null;
            this.api = null;
        }

        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            Debug.log("Speech API missing", "error");
            alert("Speech Recognition is not supported on this browser.");
            return;
        }

        this.api = new SR();
        this.api.continuous = isAndroid; 
        this.api.interimResults = true;
        this.api.lang = 'en-US';

        this.api.onstart = () => {
            Debug.log("API: onstart fired", "success");
            this.consecutiveErrors = 0;
            UI.setStatus("Listening...", "active");
        };

        this.api.onresult = (e) => {
            let latestFinal = "";
            let currentInterim = "";

            for (let i = e.resultIndex; i < e.results.length; i++) {
                const text = e.results[i][0].transcript.trim();
                if (e.results[i].isFinal) {
                    latestFinal += " " + text;
                } else {
                    currentInterim += " " + text;
                }
            }

            if (latestFinal.trim()) {
                const cleanedFinal = latestFinal.trim();
                if (!this.transcript.includes(cleanedFinal)) {
                    this.transcript = cleanedFinal; 
                    Debug.log(`Updated final: "${this.transcript}"`);
                }
            }

            this.interim = currentInterim.trim();
            this.updateDisplay();
        };

        this.api.onerror = (e) => {
            Debug.log(`API Error: ${e.error}`, "warn");
            
            if (e.error === 'service-not-allowed') {
                this.isRecording = false;
                UI.resetRecordBtn();
                UI.setStatus("Dictation disabled. Turn on 'Enable Dictation' in iOS Keyboard Settings.", "error");
                alert("Speech recognition was blocked by iOS.\n\nPlease check:\n1. Settings > General > Keyboard > Enable Dictation (Turn ON)\n2. Settings > Privacy & Security > Speech Recognition (Allow Safari)");
                return;
            }

            if (e.error === 'not-allowed' || e.error === 'audio-capture') {
                this.isRecording = false;
                UI.resetRecordBtn();
                UI.setStatus("Microphone access failed.", "error");
                return;
            }

            if (e.error === 'aborted' || e.error === 'network') {
                this.consecutiveErrors++;
            }
        };

        this.api.onend = () => {
            Debug.log("API: onend fired");
            if (this.isRecording) {
                if (this.consecutiveErrors > 3) {
                    Debug.log("Too many consecutive aborts. Halting.", "error");
                    this.isRecording = false;
                    UI.setStatus("Audio capture error. Please tap record again.", "error");
                    UI.resetRecordBtn();
                    return;
                }

                const restartDelay = isAndroid ? 400 : 150;
                this.restartTimer = setTimeout(() => {
                    if (this.isRecording) this.start(false);
                }, restartDelay);
            }
        };

        try {
            this.api.start();
        } catch(e) {
            Debug.log(`Start Exception: ${e.message}`, "error");
            UI.resetRecordBtn();
        }
    },

    stop: function() {
        Debug.log("--- STOP REQUESTED ---");
        this.isRecording = false;
        clearTimeout(this.restartTimer);

        if (this.api) {
            let hasFinalized = false;
            
            const triggerFinalize = (source) => {
                if (hasFinalized) return;
                hasFinalized = true;
                Debug.log(`API stopped cleanly via: ${source}`);
                this.finalize();
            };

            this.api.onend = () => triggerFinalize("onend event");
            
            try { 
                this.api.stop(); 
            } catch(e) { 
                triggerFinalize("stop exception"); 
            }

            setTimeout(() => {
                if (!hasFinalized) {
                    Debug.log("API hung on stop. Forcing finalize via timeout.", "warn");
                    triggerFinalize("safety timeout");
                }
            }, 800);

        } else {
            this.finalize();
        }
    },

    reset: function() {
        Debug.log("--- RESET REQUESTED ---");
        this.isRecording = false;
        clearTimeout(this.restartTimer);
        
        if (this.api) {
            this.api.onstart = null;
            this.api.onresult = null;
            this.api.onerror = null;
            this.api.onend = null;
            this.api = null; 
        }
        this.transcript = "";
        this.interim = "";
    },

    updateDisplay: function() {
        const text = (this.transcript + " " + this.interim).trim();
        UI.setLiveTranscript(text || "...");
    },

    finalize: function() {
        const fullText = (this.transcript + " " + this.interim).trim();
        Debug.log(`Finalizing transcript: "${fullText}"`);
        Analyzer.evaluate(fullText);
    }
};

/* Speech Evaluation & Alignment */
const Analyzer = {
    numToWordsMap: {
        "0": "zero", "1": "one", "2": "two", "3": "three", "4": "four", "5": "five",
        "6": "six", "7": "seven", "8": "eight", "9": "nine", "10": "ten",
        "11": "eleven", "12": "twelve", "13": "thirteen", "14": "fourteen", "15": "fifteen",
        "16": "sixteen", "17": "seventeen", "18": "eighteen", "19": "nineteen", "20": "twenty",
        "1st": "first", "2nd": "second", "3rd": "third", "4th": "fourth", "5th": "fifth",
        "6th": "sixth", "7th": "seventh", "8th": "eighth", "9th": "ninth", "10th": "tenth"
    },

    normalizeWord: function(w) {
        let clean = w.toLowerCase().replace(/[^\w\s]/g, "").trim();
        if (this.numToWordsMap[clean]) {
            return this.numToWordsMap[clean];
        }
        return clean;
    },

    evaluate: function(transcript) {
        Debug.log(`Analyzer evaluating: "${transcript}"`);
        
        if (!transcript || !transcript.trim()) {
            UI.setStatus("No speech detected. Please speak closer to the mic.", "error");
            UI.resetRecordBtn();
            return;
        }

        const expandSpoken = (s) => s.toLowerCase()
            .replace(/&/g, " and ")
            .replace(/%/g, " percent ")
            .replace(/\$/g, " dollars ")
            .replace(/-/g, " "); 

        const rawTargetWords = chunks[currentChunkIdx].trim().split(/\s+/);
        const userWords = expandSpoken(transcript)
            .split(/\s+/)
            .map(w => this.normalizeWord(w))
            .filter(Boolean);

        let html = "";
        let matches = 0;
        let totalScorable = 0;
        let userSearchIdx = 0;

        rawTargetWords.forEach(word => {
            const expanded = expandSpoken(word);
            const subWords = expanded.split(/\s+/).map(w => this.normalizeWord(w)).filter(Boolean);

            if (subWords.length === 0) {
                html += `<span class="word-correct">${word} </span>`;
            } else {
                totalScorable++;
                
                let matchedAllSubwords = true;
                let tempIdx = userSearchIdx;

                for (let sw of subWords) {
                    let foundAt = -1;
                    for (let k = tempIdx; k < Math.min(userWords.length, tempIdx + 5); k++) {
                        if (userWords[k] === sw) {
                            foundAt = k;
                            break;
                        }
                    }

                    if (foundAt !== -1) {
                        tempIdx = foundAt + 1;
                    } else {
                        matchedAllSubwords = false;
                        break;
                    }
                }

                if (matchedAllSubwords) {
                    html += `<span class="word-correct">${word} </span>`;
                    matches++;
                    userSearchIdx = tempIdx;
                } else {
                    html += `<span class="word-wrong">${word} </span>`;
                }
            }
        });

        tempMatches = matches;
        tempTotal = totalScorable;

        DOM.passageDisplay.style.display = "none";
        DOM.feedbackArea.innerHTML = html;
        
        UI.showPostActions();
        UI.setStatus(`Speech analysed — ${matches}/${totalScorable} words matched.`, "success");
        Debug.log(`Score: ${matches} / ${totalScorable} (${Math.round((matches/totalScorable)*100)}%)`, "success");
    }
};

/* TTS Audio Player */
function playText() {
    if (!window.speechSynthesis) return;

    window.speechSynthesis.cancel();
    DOM.speakBtn.classList.add("playing");

    const utter = new SpeechSynthesisUtterance(chunks[currentChunkIdx]);
    
    let voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) {
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
            applyVoiceAndSpeak(utter, voices);
        };
    } else {
        applyVoiceAndSpeak(utter, voices);
    }
}

function applyVoiceAndSpeak(utter, voices) {
    const naturalVoice = voices.find(v => v.name.includes("Google US English")) || 
                         voices.find(v => v.name.includes("Samantha")) || 
                         voices.find(v => v.lang.startsWith("en-US"));
    if (naturalVoice) utter.voice = naturalVoice;
    utter.lang = "en-US"; 
    utter.rate = 0.85; 
    utter.pitch = 1.0;

    utter.onend = () => DOM.speakBtn.classList.remove("playing");
    utter.onerror = () => DOM.speakBtn.classList.remove("playing");

    window.speechSynthesis.speak(utter);
    Debug.log("Audio synthesis started.", "info");
}

/* Mic Hardware Level Visualizer */
let audioContext = null, analyser = null, microphone = null, micStream = null, micAnimationFrame = null;

async function startMicTest(event) {
    if (event) event.preventDefault();

    try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("getUserMedia not available");
        stopMicTest();
        Debug.log("Starting Mic Test...");
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        DOM.micDot.classList.add("active");
        DOM.micLabel.innerText = "Mic Active:";
        DOM.micTestBtn.innerText = "Working!";
        DOM.micTestBtn.style.opacity = "0.6";

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        audioContext = new AudioContext();
        if (audioContext.state === "suspended") await audioContext.resume();

        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(micStream);
        analyser.fftSize = 512;
        microphone.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);
        function updateMicLevel() {
            if (!analyser) return;
            analyser.getByteFrequencyData(data);
            let total = 0;
            for (let i = 0; i < data.length; i++) total += data[i];
            const average = total / data.length;
            DOM.micBar.style.width = Math.min(100, average * 2.5) + "%";
            micAnimationFrame = requestAnimationFrame(updateMicLevel);
        }
        updateMicLevel();
    }
    catch (err) {
        Debug.log(`Mic Test Error: ${err.message}`, "error");
        stopMicTest();
        DOM.micDot.classList.remove("active");
        DOM.micLabel.innerText = "Mic Check:";
        DOM.micTestBtn.innerText = "Test Mic";
        DOM.micTestBtn.style.opacity = "1";
        alert("Microphone permission denied or inaccessible.");
    }
}

function stopMicTest() {
    if (micAnimationFrame) cancelAnimationFrame(micAnimationFrame);
    micAnimationFrame = null;
    if (microphone) { try { microphone.disconnect(); } catch (e) {} microphone = null; }
    if (analyser) { try { analyser.disconnect(); } catch (e) {} analyser = null; }
    if (audioContext) { try { audioContext.close(); } catch (e) {} audioContext = null; }
    if (micStream) { micStream.getTracks().forEach(track => track.stop()); micStream = null; }

    if (DOM.micDot) DOM.micDot.classList.remove("active");
    if (DOM.micLabel) DOM.micLabel.innerText = "Mic Check:";
    if (DOM.micTestBtn) { DOM.micTestBtn.innerText = "Test Mic"; DOM.micTestBtn.style.opacity = "1"; }
    if (DOM.micBar) DOM.micBar.style.width = "0%";
    Debug.log("Mic Test Stopped.");
}

/* Passage Parsing & Task Fetching */
function handleTaskIdInput(input) {
    if (!input.value.startsWith("ID-")) input.value = "ID-";
    input.value = input.value.toUpperCase();
}

function splitIntoSentences(text) {
    if (!text) return [];
    let protectedText = text
        .replace(/Mr\./g, "Mr___")
        .replace(/Mrs\./g, "Mrs___")
        .replace(/Ms\./g, "Ms___")
        .replace(/Dr\./g, "Dr___")
        .replace(/e\.g\./g, "eg___")
        .replace(/i\.e\./g, "ie___")
        .replace(/U\.S\.A\./g, "USA___");

    let rawChunks = protectedText.match(/[^.!?]+[.!?]+/g) || [protectedText];
    return rawChunks.map(c => {
        return c.replace(/Mr___/g, "Mr.")
                .replace(/Mrs___/g, "Mrs.")
                .replace(/Ms___/g, "Ms.")
                .replace(/Dr___/g, "Dr.")
                .replace(/eg___/g, "e.g.")
                .replace(/ie___/g, "i.e.")
                .replace(/USA___/g, "U.S.A.")
                .trim();
    }).filter(c => c.length > 0);
}

async function fetchTask() {
    [DOM.sClass, DOM.sNo, DOM.sName, DOM.sTaskId].forEach(el => el.classList.remove("error"));
    let err = false;

    if (!DOM.sClass.value.trim()) { DOM.sClass.classList.add("error"); err = true; }
    if (!DOM.sNo.value.trim()) { DOM.sNo.classList.add("error"); err = true; }
    if (!DOM.sName.value.trim()) { DOM.sName.classList.add("error"); err = true; }
    const cleanedId = DOM.sTaskId.value.trim().toUpperCase();
    if (!cleanedId || cleanedId === "ID-") { DOM.sTaskId.classList.add("error"); err = true; }

    if (err) return;

    const studentClass = DOM.sClass.value.trim();
    const studentNo = DOM.sNo.value.trim();
    const studentName = DOM.sName.value.trim();

    localStorage.setItem("reader_class", studentClass);
    localStorage.setItem("reader_no", studentNo);
    localStorage.setItem("reader_name", studentName);

    stopMicTest(); 
    setBtnLoading("btnJoin", "spinJoin", true, "Join Task");
    Debug.log(`Fetching task: ${cleanedId}`);

    try {
        const url = `${API_URL}?action=getTask&taskId=${encodeURIComponent(cleanedId)}`;
        const res = await fetchWithTimeout(url, {}, 8000);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (data.passage === "NOT_FOUND") {
            DOM.sTaskId.classList.add("error");
            alert("Invalid Task ID. Please check and try again.");
        } else if (!data.passage) {
            alert("This task does not contain a reading passage.");
        } else {
            chunks = splitIntoSentences(data.passage);
            
            DOM.studentEntry.style.display = "none";
            DOM.readingSection.style.display = "block";
            
            // 隱藏 Student / Teacher 按鈕，改為 Home 返回按鈕
            UI.setInTaskHeader(true);
            
            const sessionKey = `readaloud_session_${cleanedId}_${studentClass}_${studentNo}_${studentName}`;
            const savedSession = localStorage.getItem(sessionKey);

            if (savedSession) {
                try {
                    const sessionData = JSON.parse(savedSession);
                    currentChunkIdx = sessionData.idx || 0;
                    totalMatches = sessionData.matches || 0;
                    totalWords = sessionData.words || 0;
                    Debug.log(`Resumed session: Sentence index ${currentChunkIdx + 1}`);
                } catch(e) {
                    currentChunkIdx = 0; totalMatches = 0; totalWords = 0;
                }
            } else {
                currentChunkIdx = 0; totalMatches = 0; totalWords = 0;
            }

            tempMatches = 0; tempTotal = 0;
            showChunk();
        }
    }
    catch (e) {
        Debug.log(`Task Fetch Error: ${e.message}`, "error");
        alert("Network timeout or connection error. Please try again.");
    }
    setBtnLoading("btnJoin", "spinJoin", false, "Join Task");
}

async function showChunk() {
    Debug.log(`Loading chunk ${currentChunkIdx + 1}`);
    
    SpeechEngine.reset();
    UI.resetRecordBtn();

    const text = chunks[currentChunkIdx];
    DOM.chunkProgress.innerText = `Sentence ${currentChunkIdx + 1} of ${chunks.length}`;
    DOM.passageDisplay.innerText = text;
    DOM.passageDisplay.style.display = "block";
    DOM.feedbackArea.innerHTML = "";
    DOM.postReadingActions.style.display = "none";
    DOM.nextBtnText.innerText = (currentChunkIdx === chunks.length - 1) ? "Finish & Submit 🎉" : "Next Sentence →";
    UI.setStatus("");
    UI.setLiveTranscript("");

    DOM.translationText.innerText = "";
    DOM.translationText.style.display = "block";
    
    try {
        const res = await fetchWithTimeout(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-TW`, {}, 4000);
        const d = await res.json();
        if (d.responseData && d.responseData.translatedText) {
            DOM.translationText.innerText = d.responseData.translatedText;
        } else {
            DOM.translationText.style.display = "none";
        }
    } catch (e) {
        Debug.log("Translation API offline. Hiding translation block.", "warn");
        DOM.translationText.style.display = "none";
    }
}

/* Progress Session & Submission API */
function parseScore(val) {
    let num = parseFloat(val);
    if (isNaN(num)) return 0;
    return (num < 2 ? Math.round(num * 100) : Math.round(num));
}

async function nextChunk() {
    if (isSubmitting) return;
    
    totalMatches += tempMatches;
    totalWords += tempTotal;
    
    const tId = DOM.sTaskId.value.trim().toUpperCase();
    const studentClass = DOM.sClass.value.trim();
    const studentNo = DOM.sNo.value.trim();
    const studentName = DOM.sName.value.trim();
    const sessionKey = `readaloud_session_${tId}_${studentClass}_${studentNo}_${studentName}`;

    if (currentChunkIdx < chunks.length - 1) {
        currentChunkIdx++;
        tempMatches = 0;
        tempTotal = 0;

        const sessionData = { idx: currentChunkIdx, matches: totalMatches, words: totalWords };
        localStorage.setItem(sessionKey, JSON.stringify(sessionData));
        showChunk();
        return;
    }

    isSubmitting = true;
    setBtnLoading("nextChunkBtn", "spinNext", true, "Saving...");
    const score = totalWords > 0 ? Math.max(0, Math.min(100, Math.round((totalMatches / totalWords) * 100))) : 0;

    let success = false;
    for (let attempt = 1; attempt <= 2; attempt++) {
        try {
            Debug.log(`Submitting score (Attempt ${attempt})...`);
            await fetchWithTimeout(API_URL, {
                method: "POST", mode: "no-cors",
                body: JSON.stringify({
                    action: "submitScore", taskId: tId,
                    className: studentClass, classNo: studentNo,
                    name: studentName, score: score
                })
            }, 6000);
            success = true;
            break;
        } catch (err) {
            Debug.log(`Submission attempt ${attempt} failed: ${err.message}`, "warn");
        }
    }

    if (success) {
        localStorage.removeItem(sessionKey);
        Debug.log("Session completed & cleared.");

        try {
            const res = await fetchWithTimeout(`${API_URL}?action=getScores&taskId=${encodeURIComponent(tId)}`, {}, 6000);
            const all = await res.json();
            let top = all.sort((a, b) => parseScore(b[5]) - parseScore(a[5])).slice(0, 5);
            let board = "<table>";
            top.forEach(function(r, i) {
                const icon = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "";
                board += `<tr><td>${icon} ${r[2]}-${r[3]} ${r[4]}</td><td style="text-align:right"><b>${parseScore(r[5])}%</b></td></tr>`;
            });
            board += "</table>";
            DOM.leaderboardList.innerHTML = board;
        } catch(e) {
            DOM.leaderboardList.innerHTML = "<p style='font-size:12px;color:var(--text-muted)'>Leaderboard unavailable.</p>";
        }

        DOM.practiceArea.style.display = "none";
        DOM.resultScreen.style.display = "block";
        DOM.finalScoreDisplay.innerText = score + "%";
    } else {
        alert("Network issue saving your score. Your progress is saved, please click 'Finish & Submit' again.");
        isSubmitting = false;
    }
    setBtnLoading("nextChunkBtn", "spinNext", false, "Finish & Submit 🎉");
}

function retrySentence() {
    tempMatches = 0; tempTotal = 0;
    showChunk();
}

/* Teacher View & Score Data Management */
function setupTeacherAccess() {
    const btn = document.getElementById("btnTeacher");
    if (!btn) return;
    const start = function(e) {
        if (e.type === "touchstart") e.preventDefault();
        pressTimer = setTimeout(function() { executeSwitch("teacher"); }, 2500);
    };
    const stop = function() { clearTimeout(pressTimer); };
    btn.addEventListener("touchstart", start, { passive: false });
    btn.addEventListener("touchend", stop);
    btn.addEventListener("touchcancel", stop);
    btn.addEventListener("mousedown", start);
    btn.addEventListener("mouseup", stop);
    btn.addEventListener("mouseleave", stop);
}

function toggleTeacherMode(m) {
    document.getElementById("setupMode").style.display = m === "setup" ? "block" : "none";
    document.getElementById("scoreMode").style.display = m === "scores" ? "block" : "none";
    document.getElementById("subSet").className = m === "setup" ? "mode-btn active" : "mode-btn";
    document.getElementById("subScore").className = m === "scores" ? "mode-btn active" : "mode-btn";
}

function switchView(v) { if (v === "student") executeSwitch("student"); }
function executeSwitch(v) {
    document.querySelectorAll(".container").forEach(c => c.classList.remove("active"));
    document.getElementById(v + "View").classList.add("active");
    document.querySelectorAll(".mode-nav .mode-btn").forEach(b => b.classList.remove("active"));
    const btnTarget = document.getElementById("btn" + v.charAt(0).toUpperCase() + v.slice(1));
    if (btnTarget) btnTarget.classList.add("active");
}

function filterScoresByDisplayMode(data) {
    const mode = DOM.scoreDisplayMode.value;
    if (mode === "all" || !data.length) return [...data];

    const studentMap = new Map();
    data.forEach(r => {
        const studentKey = `${r[2]}_${r[3]}_${r[4]}`.toLowerCase();
        if (!studentMap.has(studentKey)) {
            studentMap.set(studentKey, [r]);
        } else {
            studentMap.get(studentKey).push(r);
        }
    });

    const filtered = [];
    studentMap.forEach(records => {
        if (mode === "best") {
            records.sort((a, b) => parseScore(b[5]) - parseScore(a[5]));
            filtered.push(records[0]);
        } else if (mode === "latest") {
            records.sort((a, b) => new Date(b[1]).getTime() - new Date(a[1]).getTime());
            filtered.push(records[0]);
        }
    });

    return filtered;
}

function getProcessedScores() {
    let list = filterScoresByDisplayMode(currentScores);

    list.sort((a, b) => {
        let res = 0;
        if (currentSortCol === 'time') {
            res = (new Date(a[1]).getTime() || 0) - (new Date(b[1]).getTime() || 0);
        } else if (currentSortCol === 'class') {
            res = (a[2] || '').toString().localeCompare((b[2] || '').toString(), undefined, { numeric: true });
            if (res === 0) res = (parseInt(a[3], 10) || 0) - (parseInt(b[3], 10) || 0);
        } else if (currentSortCol === 'student') {
            res = (a[4] || '').toString().localeCompare((b[4] || '').toString());
        } else if (currentSortCol === 'score') {
            res = parseScore(a[5]) - parseScore(b[5]);
        }
        return currentSortAsc ? res : -res;
    });

    return list;
}

function handleSort(col) {
    if (currentSortCol === col) {
        currentSortAsc = !currentSortAsc;
    } else {
        currentSortCol = col;
        currentSortAsc = (col === 'score' || col === 'time') ? false : true;
    }
    renderScoreTable();
}

function renderScoreTable() {
    const processed = getProcessedScores();

    if (!processed.length) {
        DOM.scoreTableArea.innerHTML = "<p style='text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;'>No student records found.</p>";
        return;
    }

    const getArrow = (col) => {
        if (currentSortCol !== col) return '<span style="color:var(--text-muted); font-weight:normal;"> ↕</span>';
        return `<span class="sort-icon">${currentSortAsc ? '▲' : '▼'}</span>`;
    };

    let h = `<table><tr>
        <th class="sortable" onclick="handleSort('time')">Time${getArrow('time')}</th>
        <th class="sortable" onclick="handleSort('class')">Class${getArrow('class')}</th>
        <th class="sortable" onclick="handleSort('student')">Student${getArrow('student')}</th>
        <th class="sortable" onclick="handleSort('score')" style="text-align:right;">Score${getArrow('score')}</th>
    </tr>`;

    processed.forEach(function(r) {
        const rawDate = r[1];
        let dateDisplay = "N/A";
        if (rawDate) {
            const d = new Date(rawDate);
            dateDisplay = isNaN(d) ? rawDate : `${d.toLocaleDateString()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
        }
        h += `<tr>
            <td style="font-size:10px;color:var(--text-muted)">${dateDisplay}</td>
            <td>${r[2]}-${r[3]}</td>
            <td><b>${r[4]}</b></td>
            <td style="color:var(--accent-green); font-weight:700; text-align:right;">${parseScore(r[5])}%</td>
        </tr>`;
    });
    h += "</table>";
    DOM.scoreTableArea.innerHTML = h;
}

async function getScores() {
    const tId = DOM.tSearchId.value.trim().toUpperCase();
    if (!tId || tId === "ID-") return;
    setBtnLoading("btnLoadScores", "spinScores", true, "Loading...");
    try {
        const res = await fetchWithTimeout(`${API_URL}?action=getScores&taskId=${encodeURIComponent(tId)}`, {}, 8000);
        currentScores = await res.json();
        DOM.scoreActionArea.style.display = currentScores.length ? "grid" : "none";
        
        currentSortCol = 'class';
        currentSortAsc = true;
        renderScoreTable();
    } catch (e) { 
        Debug.log(`Load Scores Error: ${e.message}`, "error");
        alert("Failed to load scores."); 
    }
    setBtnLoading("btnLoadScores", "spinScores", false, "Load Scores");
}

function downloadCSV() {
    const processed = getProcessedScores();
    if (!processed.length) return;
    
    const content = ["Timestamp,TaskID,Class,No,Name,Score", ...processed.map(r => `"${r[1]}","${r[0]}","${r[2]}","${r[3]}","${r[4]}","${parseScore(r[5])}%"`)].join("\n");
    const blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = `reading_scores_${DOM.tSearchId.value}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function createTask() {
    const p = DOM.tPassage.value.trim();
    const t = DOM.tName.value.trim();
    if (!p || !t) return;
    
    setBtnLoading("btnCreate", "spinCreate", true, "Generating...");
    try {
        const res = await fetchWithTimeout(API_URL, { 
            method: "POST", 
            body: JSON.stringify({ action: "createTask", email: t, passage: p }) 
        }, 8000);
        
        const taskId = await res.text();
        DOM.displayId.innerText = taskId;
        
        const previewChunks = splitIntoSentences(p);
        let previewHtml = `<div style="font-weight:600; margin-bottom:8px; color:var(--accent-blue);">Task Created! Split into ${previewChunks.length} sentences:</div>`;
        previewChunks.forEach((s, idx) => {
            previewHtml += `<div class="preview-sentence"><b>${idx + 1}.</b> ${s}</div>`;
        });
        DOM.taskPreviewBox.innerHTML = previewHtml;
        DOM.generatedIdArea.style.display = "block";
    } catch (e) { 
        alert("Failed to generate task ID. Network error."); 
    }
    setBtnLoading("btnCreate", "spinCreate", false, "Generate Task ID");
}

function setBtnLoading(id, spin, load, text) {
    const b = document.getElementById(id);
    const s = document.getElementById(spin);
    if (!b) return;
    b.disabled = load;
    if (s) s.style.display = load ? "inline-block" : "none";
    if (load) b.innerText = "Wait...";
    else b.innerHTML = spin ? `<div class="spinner" id="${spin}"></div> ${text}` : text;
}
